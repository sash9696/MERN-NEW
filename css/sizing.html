<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            margin-top: 5px;
            border: 2px solid black;

        }
        .px{
            width: 500px;
        }

        .percent{
            width: 50%;
        }
        .viewport{
            width: 50vw;
        }

        .parent{
            border:  2px solid black;
            margin-top: 20px;
            padding: 5px;
            width: 600px;
        }
    </style>
</head>
<body>
    Sizing


    <div class="px box">px</div>
    <div class="percent box">percent</div>
    <div class="viewport box">viewport</div>

    <div class="parent">
        <div class="px box">px</div>
        <div class="percent box">percent</div>
        <div class="viewport box">viewport</div>
    
    </div>

</body>
</html>
