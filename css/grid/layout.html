<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .layout{
            display: grid;
            /* 2 columns */
            grid-template-columns: 250px 1fr;

            /* 3 rows */

            grid-template-rows:  20px 1fr 20px;
            height: 100vh;
        }

        header{
            background: black;
            color: white;
            /* grid-column: 1/3; */
            grid-column-start:1 ;
            grid-column-end:3 ;
            display: flex;
            align-items: center;
            padding-left: 26px;
            font-size: 24px;
        }

        aside{
            background-color: #333;
            color: white;
            padding: 20px;
        }

        main{
            background-color: #f4f4f4;
            padding: 20px;
        }

        footer{
            background: black;
            color: white;
            grid-column: 1/3;

        }
    </style>
</head>
<body>
    <div class="layout">
        <header>Header</header>
        <aside>Sidebar</aside>
        <main>Content</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
