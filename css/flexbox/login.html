<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .login{
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }

    <div class="container">

        <form class="login">
            <h2>Login</h2>

            <input type="text" placeholder="Email"/>

            <button>Login</button>

        </form>
    </div>
</body>
</html>
