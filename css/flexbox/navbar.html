<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: black;
        }

        .logo{
            color: white;
            font-size: 24px;
        }

        .links{
            display: flex;
            gap: 20px;
        }
        .links a{
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">My Site</div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    
</body>
</html>
