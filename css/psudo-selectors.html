    <style>
        input[type='text']{
            border:  2px solid blue;
        }

        /* starts with */
        /* a[href^="https"]{

        } */

        /* ends with */

        /* a[href$=".com"]{

        /* contains */

        a[href*="google"]{
            color: green;
        }

        button:hover{
            background-color: blue;
            color: white;
        }

        input:focus{
            border: 2px solid green;
        }

        /* p::first-letter{
            font-size: 30px;

        p::before{
            content: "->";
        }


        p::after{
            content: "...";
        }
