<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <h2>Dashboard</h2>

      <nav>
        <a href="#">Home</a>
        <a href="#">Analytics</a>
        <a href="#">Users</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main class="main-content">

      <header class="header">
        <h1>Welcome Back</h1>
        <button>Profile</button>
      </header>

      <section class="cards">

        <div class="card">
          <h3>Revenue</h3>
          <p>$45,000</p>
        </div>

        <div class="card">
          <h3>Users</h3>
          <p>12,400</p>
        </div>

        <div class="card">
          <h3>Orders</h3>
          <p>1,240</p>
        </div>

      </section>

    </main>

  </div>

</body>
</html>
