<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Todo App</h1>

    <input id="todoInput" placeholder="Enter todo..."/>

    <button id="addBtn">Add</button>

    <div id="filterBox">
        <button data-filter="all" id="all">All</button>
        <button data-filter="active"  id="active">Active</button>
        <button data-filter="completed"  id="completed">Completed</button>
    </div>

    <ul id="todoList"></ul>

    <script src="index.js"></script>
    
</body>
</html>
