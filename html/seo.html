<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best HTML Course for Beginners</title>
    <!-- title appears in the browser tab and google search results -->

    <meta name="description" content="Beginner-friendly HTML course with examples">
    <meta name="keywords" content="HTML, web development">
    <meta name="author" content="John">
</head>
<body>

    <h1>Learn HTML</h1>
    <p>This course teaches HTML from scratch</p>

    <img src="html.png" alt="HTML code example">
    <!-- helps in seo and accessibility 
     search engines cant see images, only text
    -->
    
    <!-- Label -->
     <label for="name">Name:</label>
     <input id="name" type="text">

     <!-- <label>Name:

        <input type="text">
     </label> -->
     

    <!-- Meaningful links -->

    <a href="#">Learn HTML basics</a>
</body>
</html>
